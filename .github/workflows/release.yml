name: Release verification

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: node scripts/verify-release-version.mjs "${{ inputs.tag || github.ref_name }}"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  package-artifact:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - run: shasum -a 256 *.tgz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball-${{ inputs.tag || github.ref_name }}
          path: |
            *.tgz
            SHA256SUMS.txt
          if-no-files-found: error
